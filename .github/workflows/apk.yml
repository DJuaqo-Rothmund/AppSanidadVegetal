name: Pruebas y APK

on:
  push:
    paths-ignore: ["README.md", "SPEC.md", "docs/**"]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar pytest y requests
        run: pip install pytest requests pillow numpy
      - name: Pruebas
        run: python -m pytest -q tests

  # Igual que la app de fenología (PhenoRubus), que ya compila así.
  apk:
    needs: pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Paquetes del sistema para Buildozer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev automake libltdl-dev build-essential ccache lld

      # Catálogo de malezas e IA: fichas, fotos y referencias se generan desde el PDF
      # del libro (no se guardan en git; ver README, «Identificación por foto»).
      - name: Catálogo de malezas desde el PDF
        run: |
          PDF=$(ls datos/*.pdf 2>/dev/null | head -1)
          if [ -z "$PDF" ]; then
            echo "::warning::No está el PDF de malezas: la pestaña Identificar quedará sin especies del libro"
            exit 0
          fi
          sudo apt-get install -y -qq poppler-utils
          pip install pillow numpy
          python scripts/importar_malezas_pdf.py "$PDF" datos/especies-malezas.json \
            --fotos assets/especies --correcciones datos/correcciones-malezas.json
          python scripts/precalcular_referencias.py datos/especies-malezas.json assets/especies \
            datos/referencias-malezas.npz

      - name: Instalar Buildozer
        run: pip install "cython<3.1" buildozer==1.6.0 setuptools

      # Solo se cachea el SDK/NDK (~/.buildozer), no la compilación del proyecto.
      - name: Restaurar caché de SDK/NDK
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-${{ runner.os }}-${{ github.run_id }}
          restore-keys: buildozer-sdk-${{ runner.os }}-

      # freetype se descarga de savannah.gnu.org, que a veces no responde desde GitHub.
      - name: Fuentes de freetype (con espejos)
        run: |
          V=2.14.1; F=freetype-$V.tar.gz
          D=.buildozer/android/platform/build-arm64-v8a/packages/freetype
          mkdir -p "$D"
          for URL in \
            "https://download-mirror.savannah.gnu.org/releases/freetype/$F" \
            "https://downloads.sourceforge.net/project/freetype/freetype2/$V/$F" \
            "https://download.savannah.gnu.org/releases/freetype/$F"; do
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 -o "$D/$F" "$URL" \
               && tar -tzf "$D/$F" > /dev/null; then
              touch "$D/.mark-$F"; echo "freetype desde $URL"; break
            fi
            rm -f "$D/$F"
          done

      # Si el repositorio tiene el secreto FIREBASE_CONFIG (contenido de
      # firebase_config.json), se empaqueta en el APK. Sin él, la app abre
      # y avisa que falta la configuración.
      - name: Configuración de Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" > firebase_config.json
            echo "firebase_config.json creado desde el secreto"
          else
            echo "::warning::Falta el secreto FIREBASE_CONFIG; el APK no podrá iniciar sesión"
          fi

      - name: Compilar APK de prueba
        run: yes | buildozer -v android debug

      # Un paquete de pip con partes compiladas para el computador (x86-64) hace que
      # la app se cierre al abrir en el teléfono (ARM). Si aparece uno, se detiene aquí.
      - name: Verificar que las bibliotecas sean para el teléfono (ARM)
        run: |
          SP=.buildozer/android/platform/build-arm64-v8a/dists/sanidad/_python_bundle__arm64-v8a/_python_bundle/site-packages
          find "$SP" -name '*.so' -exec file {} + > /tmp/so.txt
          grep -c "ARM aarch64" /tmp/so.txt || true
          if grep -v "ARM aarch64" /tmp/so.txt; then
            echo "::error::Hay bibliotecas que no son ARM (ver arriba)"; exit 1
          fi

      # Firma con la llave de la app (secretos ANDROID_KEYSTORE_*), para que cada
      # versión se instale como ACTUALIZACIÓN encima de la anterior. Se verifica la
      # huella: si el secreto tiene otra llave, la compilación falla.
      - name: Firmar con la llave de la app y verificar
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Faltan los secretos ANDROID_KEYSTORE_*: el APK queda con firma de prueba"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
          BT=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/* | sort -V | tail -1)
          APK=$(ls bin/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/alineado.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/app.keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "${KEY_ALIAS:-sanidad}" --key-pass env:KEYSTORE_PASSWORD \
            --out "$APK" "$RUNNER_TEMP/alineado.apk"
          rm -f "$RUNNER_TEMP/app.keystore"
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "SHA-256 digest: 92f0c33f231dcc8ea61f0e1aa45f16337fc6dae5d51788e5054c13a98c3bb755" "$RUNNER_TEMP/certs.txt"

      - name: Guardar caché de SDK/NDK
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-${{ runner.os }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: sanidad-apk-debug
          path: bin/*.apk
          if-no-files-found: error
