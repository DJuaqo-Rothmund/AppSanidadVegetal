name: Pruebas y APK

on:
  push:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar pytest y requests
        run: pip install pytest requests
      - name: Pruebas
        run: python -m pytest -q tests

  apk:
    needs: pruebas
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Paquetes del sistema para Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Instalar Buildozer
        run: pip install "buildozer==1.5.0" "cython==0.29.36" setuptools

      - name: Caché de Buildozer (SDK, NDK y recetas)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      # Si el repositorio tiene el secreto FIREBASE_CONFIG (contenido de
      # firebase_config.json), se empaqueta en el APK. Sin él, la app abre
      # y avisa que falta la configuración.
      - name: Configuración de Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" > firebase_config.json
            echo "firebase_config.json creado desde el secreto"
          else
            echo "::warning::Falta el secreto FIREBASE_CONFIG; el APK no podrá iniciar sesión"
          fi

      - name: Compilar APK de prueba
        run: yes | buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: sanidad-apk-debug
          path: bin/*.apk
          if-no-files-found: error
